name: DAWN Model Gateway

on:
  pull_request:
    paths:
      - "dawn/**"
      - ".github/workflows/dawn-model-gateway.yml"
  push:
    branches:
      - "agent/dawn-librechat-model-gateway"
    paths:
      - "dawn/**"
      - ".github/workflows/dawn-model-gateway.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dawn/model-gateway

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: dawn/model-gateway/requirements.txt

      - name: Install gateway dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Run policy tests
        run: pytest -q

      - name: Compile gateway
        run: python -m py_compile app.py

      - name: Validate shell scripts
        working-directory: .
        run: bash -n dawn/scripts/bootstrap.sh dawn/scripts/start.sh dawn/scripts/verify.sh dawn/scripts/stop.sh

      - name: Validate JSON policy
        working-directory: .
        run: python -m json.tool dawn/model-policy.json >/dev/null
